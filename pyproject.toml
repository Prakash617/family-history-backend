[project]
name = "family-tree-backend"
version = "0.1.0"
description = "Family Historical Tree Django REST API backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.27",
    "django-cors-headers>=4.4",
    "django-filter>=24.2",
    "pillow>=10.4",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["RUF012", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "integrations"]
